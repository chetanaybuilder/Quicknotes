name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install Dependencies
      run: npm run install:all
    
    - name: Lint
      run: npm run lint
      continue-on-error: true # Not strictly enforcing right away, but setup

    - name: Build Client
      run: npm run build

    - name: Test
      run: npm run test

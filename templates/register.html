<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
</head>
<body>
    <main>
        <header>
    <h1>Register</h1>
    </header
    <section>
        <form action="/register" method="post">
    
        <input type="text"
        name="username"
        placeholder="Enter your username">
    
    
        <input type="email"
        name="email"
        placeholder="Enter your email">
    

        <input type="password"
        name="password"
        placeholder="Enter your password">

        <button type="submit">Register</button>
        </form>
    </section>
    </main> 
</body>
</html>

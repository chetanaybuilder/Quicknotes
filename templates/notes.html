<!DOCTYPE html>
<html>

<head>
    <title>QuickNotes</title>
</head>

<body>

    <h1>Welcome to QuickNotes</h1>

    <form action="/notes" method="POST">
        <hr>

<h2>My Notes</h2>

{% for note in notes %}

<h3>{{ note["title"] }}</h3>

<p>{{ note["content"] }}</p>

<hr>

{% endfor %}
form action="/delete/{{ note['id'] }}" method="POST">

    <button type="submit">
        Delete
    </button>

</form>
<

        <input
            type="text"
            name="title"
            placeholder="Enter Title"
            required>

        <br><br>

        <textarea
            name="content"
            placeholder="Write your note..."
            required></textarea>

        <br><br>

        <button type="submit">
            Save Note
        </button>

    </form>

</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <title>QuickNotes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="notes-container">

        <h1>Welcome to QuickNotes 📝</h1>

        <div class="note-form">

            <h2>Create a Note</h2>

            <form action="/notes" method="POST">

                <input
                    type="text"
                    name="title"
                    placeholder="Enter Title"
                    required>

                <br><br>

                <textarea
                    name="content"
                    placeholder="Write your note..."
                    required></textarea>

                <br><br>

                <button class="save-btn" type="submit">
                    Save Note
                </button>

            </form>

        </div>

        <hr>

        <h2>My Notes</h2>

        {% for note in notes %}

        <div class="note-card">

            <h3>{{ note["title"] }}</h3>

            <p>{{ note["content"] }}</p>

            <form action="/delete/{{ note['id'] }}" method="POST">

                <button class="delete-btn" type="submit">
                    Delete
                </button>

            </form>

        </div>

        <br>

        {% endfor %}

    </main>

</body>

</html>
